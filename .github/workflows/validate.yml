name: Validate and build reports
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
# Actions are pinned to full commit SHAs; Dependabot (.github/dependabot.yml) proposes updates.
# Required status checks for main: fast, container, full.
jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.6'
          cache: pip
          cache-dependency-path: |
            scripts/health_pipeline/requirements.lock.txt
            reports/requirements.txt
            scripts/ci/requirements-lint.txt
      - run: pip install -r scripts/health_pipeline/requirements.txt -r scripts/ci/requirements-lint.txt
      - name: Lint Python (Ruff)
        run: ruff check --output-format=github .
      - name: Unit, schema and contract tests
        run: python -m pytest -q
      - name: Snakemake dry run
        run: snakemake --dry-run --cores 1

  container:
    name: container
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build report container
        run: docker build --file Dockerfile.report --tag health-report:reports-ci .

      - name: Build both reports inside report container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/app" \
            health-report:reports-ci \
            snakemake --cores 2 --config out=reproduced/container-ci

      - name: Verify container reports and that a rebuild is a no-op
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/app" \
            health-report:reports-ci \
            sh -ec '
              test -s reproduced/container-ci/site/researcher.html
              test -s reproduced/container-ci/site/public_health.html
              test -s reproduced/container-ci/site/index.html
              snakemake --dry-run --cores 1 --config out=reproduced/container-ci > /tmp/noop.log 2>&1
              cat /tmp/noop.log
              grep -q "Nothing to be done" /tmp/noop.log
            '

  full:
    name: full
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.6'
          cache: pip
          cache-dependency-path: |
            scripts/health_pipeline/requirements.lock.txt
            reports/requirements.txt
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.10.19"
      - run: pip install -r scripts/health_pipeline/requirements.txt
      - name: Build both reports
        run: snakemake --cores 2
      - name: Verify the reports and their provenance exist
        run: |
          test -s results/site/researcher.html
          test -s results/site/public_health.html
          test -s results/site/provenance_researcher.json
          test -s results/site/provenance_public_health.json
          test -s results/site/index.html
      - name: Rebuild is a no-op
        run: snakemake --dry-run --cores 1 2>&1 | tee /tmp/dry-run.txt && grep -q "Nothing to be done" /tmp/dry-run.txt
      - name: Upload only a successful complete build
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-report-${{ github.sha }}
          path: results/site/
          retention-days: 30
          if-no-files-found: error
