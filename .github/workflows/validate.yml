name: Validate and build reports
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
# Actions are pinned to full commit SHAs; Dependabot (.github/dependabot.yml) proposes updates.
# Required status checks for main: fast, secrets, container, full (docs/phase-6-ci-hardening.md).
jobs:
  fast:
    name: fast
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.6'
          cache: pip
          cache-dependency-path: |
            scripts/health_pipeline/requirements.lock.txt
            scripts/ci/requirements-lint.txt
      - run: pip install -r scripts/health_pipeline/requirements.lock.txt -r scripts/ci/requirements-lint.txt
      - name: Lint Python (Ruff)
        run: ruff check --output-format=github .
      - name: Python unit, schema and contract tests
        # R presentation, report_runtime and quarto_runtime tests run with the
        # complete suite in the report container.
        run: python -m pytest -q --strict-markers --ignore=tests/test_tabular_presentation.py -m "not report_runtime and not quarto_runtime"
      - name: Snakemake dry run
        run: snakemake --dry-run --cores 1

  rfree-pilot:
    name: rfree-pilot
    needs: fast
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build R-free pilot image
        run: docker build --file Dockerfile.report.pilot --tag health-report:rfree-ci .

      - name: Verify R-free runtime
        run: |
          docker image inspect health-report:rfree-ci --format 'RFree image {{.Id}}'
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/app" \
            --workdir /app \
            health-report:rfree-ci sh -ec "
              set -eu
              command -v quarto
              quarto --version
              python --version
              python -c 'import matplotlib; print(\"MATPLOTLIB\", matplotlib.__version__)'
              if command -v Rscript >/dev/null 2>&1; then
                echo 'Rscript must be absent from the rfree-pilot image' >&2
                exit 1
              fi
            "

      - name: Run mandatory quarto_runtime tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --volume "$PWD:/app" \
            --workdir /app \
            health-report:rfree-ci sh -ec "
              python -m pytest -q -rs -m quarto_runtime --strict-markers \
                -p no:cacheprovider --junitxml=/app/rfree-quarto-runtime.xml
            "

      - name: Enforce four executed quarto_runtime tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/app" \
            --workdir /app \
            health-report:rfree-ci python -c "import xml.etree.ElementTree as ET; root=ET.parse('/app/rfree-quarto-runtime.xml').getroot(); cases=root.findall('.//testcase'); skipped=root.findall('.//skipped'); failed=root.findall('.//failure')+root.findall('.//error'); print('QUARTO_RUNTIME_CASES', len(cases), [c.get('name') for c in cases]); ok=(len(cases)==4 and not skipped and not failed); raise SystemExit(0 if ok else 'expected 4 executed quarto_runtime tests with no skips/failures')"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan history for committed secrets (pinned gitleaks)
        run: bash scripts/ci/secret_scan.sh .

  container:
    name: container
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build report container
        run: docker build --file Dockerfile.report --tag health-report:reports-ci .

      - name: Full test suite including R presentation regressions
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/app" \
            health-report:reports-ci \
            sh -ec 'command -v Rscript >/dev/null; python -m pytest -q'

      - name: Report-runtime integration tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/app" \
            health-report:reports-ci \
            sh -ec 'command -v Rscript >/dev/null; command -v quarto >/dev/null; python -m pytest -q -m "report_runtime" --strict-markers'

      - name: Build all audiences inside report container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/app" \
            health-report:reports-ci \
            snakemake --cores 2 --config out=reproduced/container-ci

      - name: Verify container reports and packaged apps
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/app" \
            health-report:reports-ci \
            sh -ec '
              python scripts/health_pipeline/check_outputs.py --out reproduced/container-ci
              python scripts/health_pipeline/verify_release.py --out reproduced/container-ci
              Rscript tests/shiny_smoke.R reproduced/container-ci/reports/researcher/app
              Rscript tests/dashboard_smoke.R reproduced/container-ci/reports/researcher/app
              snakemake --dry-run --cores 1 --config out=reproduced/container-ci > /tmp/noop.log 2>&1
              cat /tmp/noop.log
              grep -q "Nothing to be done" /tmp/noop.log
            '

  full:
    name: full
    needs: fast
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.6'
          cache: pip
          cache-dependency-path: scripts/health_pipeline/requirements.lock.txt
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.3.2'
          use-public-rspm: true
      - run: Rscript workflow/restore_r.R
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.3.353"
      - name: Install pinned TinyTeX
        run: bash scripts/ci/install_tinytex.sh 2026.10
      - run: pip install -r scripts/health_pipeline/requirements.lock.txt
      - name: Build all audiences (HTML, PDF, Shiny, release)
        run: snakemake --cores 2
      - name: Verify three audience outputs and provenance
        run: python scripts/health_pipeline/check_outputs.py
      - name: Verify release hashes, provenance and rendered links
        run: python scripts/health_pipeline/verify_release.py --out results
      - run: Rscript tests/shiny_smoke.R results/reports/researcher/app
      - run: Rscript tests/dashboard_smoke.R results/reports/researcher/app
      - name: Rebuild is a no-op
        run: snakemake --dry-run --cores 1 2>&1 | tee /tmp/dry-run.txt && grep -q "Nothing to be done" /tmp/dry-run.txt
      - name: Upload only a successful complete release
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-report-${{ github.sha }}
          path: results/
          retention-days: 30
          if-no-files-found: error
