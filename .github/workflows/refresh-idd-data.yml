name: Refresh IDD reference data

on:
  schedule:
    - cron: "30 23 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-idd-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: |
            scripts/health_pipeline/requirements.lock.txt
            reports/utils/requirements.txt
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.10.19"
      - name: Install locked Python dependencies
        run: python -m pip install -r scripts/health_pipeline/requirements.txt
      - name: Test workflow code
        run: python -m pytest -q
      - name: Pull the latest IDD CSV and metadata exports
        run: python -u src/sync_idd_exports.py
      - name: Build validated reports
        run: |
          set -o pipefail
          snakemake --cores 2 || {
            status=$?
            if [ -f results/checks.csv ]; then
              echo '--- Validation failures ---'
              python - <<'PY'
          import pandas as pd
          checks = pd.read_csv('results/checks.csv')
          failed = checks[checks['status'].eq('FAIL')]
          print(failed.to_string(index=False) if not failed.empty else 'No FAIL rows found in results/checks.csv')
          PY
            fi
            exit "$status"
          }
      - name: Verify the reports exist
        run: |
          test -s results/site/researcher.html
          test -s results/site/public_health.html
      - name: Commit changed source snapshots
        shell: bash
        run: |
          git add -- data/reference
          if git diff --cached --quiet -- data/reference; then
            echo "IDD exports unchanged; no data commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update IDD reference data"
            git push origin HEAD:main
          fi
      - name: Upload the reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-report-${{ github.run_id }}
          path: results/site/
          retention-days: 30
