[project]
name = "health-report-generator"
version = "0.1.0"
requires-python = ">=3.11.6,<3.12"
# Exact versions: scripts/health_pipeline/requirements.lock.txt and reports/requirements.txt.
dependencies = [
    "pandas==2.2.3",
    "plotly==5.24.1",
    "pyarrow==19.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "snakemake==8.30.0",
    "streamlit==1.66.0",
]

[tool.ruff]
# Lint only: the existing compact style is kept; `ruff format` is not enforced.
target-version = "py311"

[tool.ruff.lint]
# Syntax errors, undefined names, unused imports/variables and other pyflakes defects.
select = ["E9", "F"]
