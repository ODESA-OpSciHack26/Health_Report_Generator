[project]
name = "health-report-generator"
version = "0.1.0"
requires-python = ">=3.11.6,<3.12"
dependencies = []

[tool.ruff]
# Lint only: the existing compact style is kept; `ruff format` is not enforced.
target-version = "py311"

[tool.ruff.lint]
# Syntax errors, undefined names, unused imports/variables and other pyflakes defects.
select = ["E9", "F"]

[tool.pytest.ini_options]
# Collect maintained tests, not generated acceptance/donor clones.
testpaths = ["tests"]
markers = [
    "report_runtime: requires the real Quarto/R report runtime and external executables",
    "quarto_runtime: requires Quarto and the Python tabular renderer; not an R dependency",
]
