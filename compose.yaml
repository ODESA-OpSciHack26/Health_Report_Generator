services:
  report:
    image: health-report-generator-report:local
    build:
      context: .
      dockerfile: Dockerfile.report
    platform: linux/amd64
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/health-report-config
      XDG_CACHE_HOME: /tmp/health-report-cache
      HEALTH_REPORT_R_LIBRARY: /opt/health-report-r-library
      R_LIBS_USER: /opt/health-report-r-library
    command: ["snakemake", "--cores", "2"]

  sync:
    build:
      context: .
      dockerfile: Dockerfile.report
    platform: linux/amd64
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/health-report-cache
    command: ["python", "src/sync_idd_exports.py"]

  ui:
    profiles: ["ui"]
    platform: linux/amd64
    image: health-report-generator-report:local
    working_dir: /app
    ports:
      - "2718:2718"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
      - ./.cache/uv:/tmp/uv-cache
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/health-report-config
      XDG_CACHE_HOME: /tmp/health-report-cache
      HEALTH_REPORT_R_LIBRARY: /opt/health-report-r-library
      R_LIBS_USER: /opt/health-report-r-library
    command: ["marimo", "run", "src/ui.py", "--host", "0.0.0.0", "--port", "2718"]
