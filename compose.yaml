services:
  report:
    image: health-report:local
    build:
      context: .
      dockerfile: Dockerfile.report
    platform: linux/amd64
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/health-report-config
      XDG_CACHE_HOME: /tmp/health-report-cache
      HEALTH_REPORT_R_LIBRARY: /opt/health-report-r-library
      R_LIBS_USER: /opt/health-report-r-library
    command: ["snakemake", "--cores", "2"]

  sync:
    build:
      context: .
      dockerfile: Dockerfile.report
    platform: linux/amd64
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/health-report-cache
    command: ["python", "src/sync_idd_exports.py"]

  app:
    image: health-report:local
    build:
      context: .
      dockerfile: Dockerfile.report
    platform: linux/amd64
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
    ports:
      - "8501:8501"
      - "8502:8502"
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/health-report-config
      XDG_CACHE_HOME: /tmp/health-report-cache
      HEALTH_REPORT_R_LIBRARY: /opt/health-report-r-library
      R_LIBS_USER: /opt/health-report-r-library
    command:
      - streamlit
      - run
      - src/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --browser.gatherUsageStats=false
