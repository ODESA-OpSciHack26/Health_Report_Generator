services:
  # Builds both reports into results/site/: `docker compose run --rm report`.
  report:
    image: health-report:local
    build:
      context: .
      dockerfile: Dockerfile.report
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/health-report-config
      XDG_CACHE_HOME: /tmp/health-report-cache
    command: ["snakemake", "--cores", "2"]

  # Downloads the latest FOPH exports into data/reference/.
  sync:
    image: health-report:local
    build:
      context: .
      dockerfile: Dockerfile.report
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/health-report-cache
    command: ["python", "src/sync_idd_exports.py"]

  # Web page: pick a report and diseases, get one HTML file. http://localhost:8501
  app:
    image: health-report:local
    build:
      context: .
      dockerfile: Dockerfile.report
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
    ports:
      - "8501:8501"
      - "8502:8502"
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/health-report-config
      XDG_CACHE_HOME: /tmp/health-report-cache
    command:
      - streamlit
      - run
      - src/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.maxUploadSize=500  # MB; a full harmonised.csv is about 230 MB
      - --browser.gatherUsageStats=false
